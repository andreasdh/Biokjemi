<figure class="bk-figur">
<svg viewBox="0 0 640 304" role="img" aria-label="Stoffskiftets tre trinn: fordøyelse, samling til acetyl-CoA og full oksidasjon">
<defs><marker id="pil-st" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
<rect x="20" y="14" width="600" height="84" rx="12" class="f-rosa"/>
<text x="38" y="40" style="font-weight:700;fill:#1f2f38">Trinn 1: Fordøyelse</text>
<text x="38" y="62" style="fill:#1f2f38">Store molekyler brytes i byggesteiner</text>
<text x="38" y="82" class="liten" style="fill:#1f2f38;opacity:.85">Proteiner → aminosyrer · Polysakkarider → sukker · Lipider → fettsyrer</text>
<rect x="20" y="112" width="600" height="84" rx="12" class="f-gul"/>
<text x="38" y="138" style="font-weight:700;fill:#1f2f38">Trinn 2: Samling</text>
<text x="38" y="160" style="fill:#1f2f38">Byggesteinene omdannes til en felles energivaluta</text>
<text x="38" y="180" class="liten" style="fill:#1f2f38;opacity:.85">Acetyl-CoA (fra glukose via glykolysen og pyruvat)</text>
<rect x="20" y="210" width="600" height="84" rx="12" class="f-groenn"/>
<text x="38" y="236" style="font-weight:700;fill:#1f2f38">Trinn 3: Full oksidasjon</text>
<text x="38" y="258" style="fill:#1f2f38">Acetyl-CoA brennes helt ned, og elektronene brukes til ATP</text>
<text x="38" y="278" class="liten" style="fill:#1f2f38;opacity:.85">Sitronsyresyklusen → NADH → elektrontransportkjeden → ATP</text>
<path d="M320 100 V110" class="pil" marker-end="url(#pil-st)" stroke-width="3"/>
<path d="M320 198 V208" class="pil" marker-end="url(#pil-st)" stroke-width="3"/>
</svg>
<figcaption>Energi fra mat hentes i tre trinn. Glykolysen (neste kapittel) hører til trinn 2: den gjør glukose om til pyruvat, som blir til acetyl-CoA.</figcaption>
</figure>
